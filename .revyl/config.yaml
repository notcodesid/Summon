# Revyl CLI Configuration
# Generated by: revyl init
# Edit these settings or run: revyl config set <key> <value>
# Docs: https://docs.revyl.ai/cli/hot-reload

project:
    name: summon
    org_id: d8e3ccc2-72f6-40f8-8dc8-98caa9cad1e0
build:
    system: Expo
    command: npx --yes eas-cli build --platform ios --profile development --local --output build/app.tar.gz
    output: build/app.tar.gz
    platforms:
        android:
            command: npx --yes eas-cli build --platform android --profile development --local --output build/app.apk
            output: build/app.apk
            app_id: 7a4d5093-8c7e-4cd2-a9f5-06103edc579c
        ios:
            command: npx --yes eas-cli build --platform ios --profile revyl-build --local --output build/app.tar.gz
            output: build/app.tar.gz
            app_id: 6a189e7b-2026-460f-8a01-a603e3ea708f
defaults:
    open_browser: true
    timeout: 1800
# Dev mode / hot reload configuration
hotreload:
    default: expo
    providers:
        expo:
            # Metro bundler port (default 8081). Change if port conflicts.
            port: 8081
            # URL scheme from app.json or app.config.js (required for Expo deep linking)
            app_scheme: summon
            # Maps platform to build.platforms key for dev build resolution
            platform_keys:
                android: android
                ios: ios
