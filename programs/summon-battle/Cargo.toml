[package]
name = "summon-battle"
version = "0.1.0"
description = "Summon collection and MagicBlock-powered battle program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "summon_battle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "=1.2.0"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
